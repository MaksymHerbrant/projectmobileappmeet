<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    a{color:var(--pri);text-decoration:none}
    a:hover{color:var(--pri-c)}

    .root{
      width:390px;height:844px;overflow:hidden;position:relative;
      display:flex;flex-direction:column;
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
      -webkit-font-smoothing:antialiased;
      color:var(--on-sur);background:linear-gradient(180deg,var(--g1),var(--g2));
    }
    /* Гама Графіт — значення взяті з AppTheme застосунку */
    .root[data-t="light"]{
      --pri:#39608F;--on-pri:#FFFFFF;--pri-c:#D3E4FF;--on-pri-c:#1E4875;
      --sec-c:#D7E3F8;--on-sec-c:#3C4758;
      --sur:#F8F9FF;--on-sur:#191C20;--on-sur-v:#43474E;--out:#C3C6CF;
      --sur-hi:#E7E8EE;--sur-hst:#E1E2E8;
      --err:#BA1A1A;--err-c:#FFDAD6;--ok:#1B6B3C;--warn:#8A5B00;--on:#1B8A4B;
      --g1:#E9EEF6;--g2:#FDFDFF;--sh:0 1px 2px rgba(25,28,32,.05),0 8px 24px rgba(25,28,32,.07);
    }
    .root[data-t="dark"]{
      --pri:#A3C9FE;--on-pri:#00315B;--pri-c:#1E4875;--on-pri-c:#D3E4FF;
      --sec-c:#3C4758;--on-sec-c:#D7E3F8;
      --sur:#111418;--on-sur:#E1E2E8;--on-sur-v:#C3C6CF;--out:#43474E;
      --sur-hi:#272A2F;--sur-hst:#32353A;
      --err:#FFB4AB;--err-c:#93000A;--ok:#6EDBA0;--warn:#E2B159;--on:#4CD98A;
      --g1:#1A2029;--g2:#0E1116;--sh:0 1px 2px rgba(0,0,0,.35),0 8px 24px rgba(0,0,0,.30);
    }

    .pad{padding:0 20px}
    .body{flex:1;overflow:hidden;display:flex;flex-direction:column}
    .top{display:flex;align-items:center;gap:12px;padding:56px 20px 14px}
    .top .sp{flex:1}
    .iconbtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;
      background:var(--sur);color:var(--on-sur);box-shadow:var(--sh);flex:none}
    h1{font-size:27px;font-weight:760;letter-spacing:-.6px;line-height:1.12;text-wrap:balance}
    h2{font-size:19px;font-weight:720;letter-spacing:-.3px}
    .lbl{font-size:11px;font-weight:700;letter-spacing:1.1px;text-transform:uppercase;color:var(--on-sur-v)}
    .sub{font-size:14.5px;line-height:1.5;color:var(--on-sur-v)}
    .tiny{font-size:12px;color:var(--on-sur-v)}

    .card{background:var(--sur);border-radius:16px;box-shadow:var(--sh)}
    .btn{height:52px;border-radius:16px;background:var(--pri);color:var(--on-pri);
      display:flex;align-items:center;justify-content:center;gap:8px;
      font-size:16px;font-weight:660;letter-spacing:-.1px}
    .btn.ghost{background:transparent;color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--out)}
    .field{height:52px;border-radius:14px;background:var(--sur);border:1px solid var(--out);
      display:flex;align-items:center;gap:10px;padding:0 16px;font-size:16px;color:var(--on-sur)}
    .field .ph{color:var(--on-sur-v)}
    .chip{height:34px;padding:0 14px;border-radius:999px;display:inline-flex;align-items:center;
      gap:6px;font-size:13px;font-weight:600;background:var(--sec-c);color:var(--on-sec-c)}
    .chip.on{background:var(--pri);color:var(--on-pri)}
    .chip.sm{height:28px;padding:0 11px;font-size:12px}
    .row{display:flex;align-items:center;gap:12px}
    .col{display:flex;flex-direction:column}
    .gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.gap16{gap:16px}.gap20{gap:20px}
    .wrap{display:flex;flex-wrap:wrap;gap:8px}

    .av{border-radius:50%;display:grid;place-items:center;font-weight:700;flex:none;
      background:var(--pri-c);color:var(--on-pri-c);letter-spacing:-.3px}
    .ph-block{background:
      radial-gradient(120% 90% at 28% 22%, var(--pri-c) 0%, transparent 55%),
      linear-gradient(150deg,var(--sur-hst),var(--sur-hi));
      display:grid;place-items:center;color:var(--on-sur-v);font-weight:760}

    /* фірмовий мотив: кільця відстані */
    .rings{position:absolute;inset:0;pointer-events:none;opacity:.55}
    .rings i{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
      border-radius:50%;border:1px solid var(--out)}

    .nav{height:78px;display:flex;align-items:center;justify-content:space-around;
      background:var(--sur);border-top:1px solid var(--out);color:var(--on-sur-v);flex:none}
    .nav .it{width:52px;height:44px;border-radius:14px;display:grid;place-items:center}
    .nav .it.on{background:var(--pri-c);color:var(--on-pri-c)}

    .seg{display:flex;background:var(--sur-hi);border-radius:14px;padding:4px;gap:4px}
    .seg div{flex:1;height:38px;border-radius:11px;display:grid;place-items:center;
      font-size:13.5px;font-weight:640;color:var(--on-sur-v)}
    .seg div.on{background:var(--sur);color:var(--on-sur);box-shadow:var(--sh)}

    .dist{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;
      border-radius:999px;background:rgba(0,0,0,.42);color:#fff;font-size:12px;font-weight:660;
      backdrop-filter:blur(6px)}
    .bar{height:4px;border-radius:2px;background:var(--out);position:relative}
    .bar i{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--pri)}
    .dot{width:10px;height:10px;border-radius:50%;background:var(--on);
      box-shadow:0 0 0 2.5px var(--sur)}
  </style>
</helmet>
<div class="root" data-t="{{theme}}">

<div class="ph-block" style="height:330px;font-size:76px;position:relative;flex:none">М
  <div style="position:absolute;top:52px;right:20px;display:flex;gap:10px">
    <div class="iconbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg></div><div class="iconbtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></div></div>
  <div style="position:absolute;left:20px;bottom:18px;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.5)">
    <div style="font-size:27px;font-weight:760;letter-spacing:-.5px">Максим, 21</div>
    <div class="row gap6" style="margin-top:4px;font-size:13.5px;opacity:.92"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg> Львів</div></div>
  <div style="position:absolute;right:20px;bottom:20px;display:flex;gap:5px">
    <span style="width:22px;height:3px;border-radius:2px;background:#fff"></span>
    <span style="width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.4)"></span>
    <span style="width:22px;height:3px;border-radius:2px;background:rgba(255,255,255,.4)"></span></div>
</div>
<div class="body" style="background:var(--g2);border-radius:22px 22px 0 0;margin-top:-22px;
  padding:20px 20px 0;position:relative;overflow:hidden">
  <div class="row gap10" style="margin-bottom:16px">
    <div class="chip sm" style="background:var(--ok);color:var(--sur)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg> перевірений</div>
    <div class="chip sm"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/></svg> 4 події</div>
  </div>
  <div class="lbl">про мене</div>
  <p class="sub" style="color:var(--on-sur);margin-top:8px">
    Вчусь у НУЛП, пишу код. Влітку — гори, взимку — настолки й довгі розмови на кухні.</p>
  <div class="lbl" style="margin-top:20px">інтереси</div>
  <div class="wrap" style="margin-top:10px">
    <div class="chip sm">Програмування</div><div class="chip sm">Фотографія</div>
    <div class="chip sm">Похід з наметом</div><div class="chip sm">Настільні ігри</div></div>
  <div class="card row" style="margin-top:20px;padding:14px 16px;justify-content:space-between">
    <div class="row gap10"><span style="color:var(--pri)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span>
      <span class="sub" style="color:var(--on-sur)">Безпека зустрічей</span></div>
    <span style="color:var(--on-sur-v)"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></span></div>
</div>
<div class="nav"><div class="it"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="12" height="15" rx="2"/><path d="M8 4h9a2 2 0 0 1 2 2v11"/></svg></div><div class="it"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 7l10 6 10-6"/></svg></div><div class="it"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 5.7a5 5 0 0 0-7.1 0L12 7.4l-1.7-1.7a5 5 0 1 0-7.1 7.1L12 21l8.8-8.2a5 5 0 0 0 0-7.1z"/></svg></div><div class="it on"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></div></div>

</div>
</x-dc>
<script data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Тема"}}'>
class Component extends DCLogic {
  renderVals() {
    return { theme: (this.props.dark ?? false) ? 'dark' : 'light' };
  }
}
</script>
</body>
</html>
